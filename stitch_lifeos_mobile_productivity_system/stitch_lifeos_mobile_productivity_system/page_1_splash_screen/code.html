<!-- Micro-interaction logic for realistic database sync progression -->
<script>
    (function() {
      const syncProgress = document.getElementById('sync-progress');
      const syncLabel = document.getElementById('sync-label');
      const stages = [
        { width: '28%', text: 'sqlite offline sync' },
        { width: '64%', text: 'indexing local state' },
        { width: '88%', text: 'verifying telemetry' },
        { width: '100%', text: 'workspace ready' }
      ];
      let currentStage = 0;

      const interval = setInterval(() => {
        currentStage++;
        if (currentStage < stages.length) {
          syncProgress.style.width = stages[currentStage].width;
          syncLabel.textContent = stages[currentStage].text;
          if (currentStage === stages.length - 1) {
            syncLabel.classList.remove('text-outline');
            syncLabel.classList.add('text-primary');
          }
        } else {
          clearInterval(interval);
        }
      }, 1200);
    })();
  </script>
